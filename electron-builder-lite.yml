# Build da versao LEVE (main-lite.js) sem encostar no package.json do app pago.
# A cicatriz anterior foi editar o package.json na mao e depois reverter; aqui o entry
# e a versao entram por extraMetadata, entao o app pago segue intacto em 0.4.5.
appId: com.vperslab.vpertsmultilite
productName: VpertsMultiLeve
directories:
  output: dist
extraMetadata:
  main: main-lite.js
  version: 0.8.2
files:
  - main-lite.js
  - lite-titlebar-preload.js
  - host-preload.js
  - cdp.js
  - config.js
  - vperts-ext/**/*
  - renderer/host-toolbar.html
  - renderer/lite-titlebar.html
  - renderer/dashboard-lite.html
  - renderer/stats-grid.html
  - renderer/overlay.html
  - renderer/alerta.html
  - renderer/curtain.html
  - renderer/logo-vp.png
  - renderer/logo-vp.ico
  - renderer/assets/**/*
  # OBRIGATORIO: as 6 telas usam ./fonts/fonts.css (Inter/Cinzel locais). Sem esta linha
  # o portable sai com a fonte do sistema e o visual quebra - e so no exe, nao no dev.
  - renderer/fonts/**/*
  # sprites shiny extraidos do proprio jogo (ver renderer/sprites/LEIA.md)
  - renderer/sprites/**/*
  # runtime deps do app: ws (cdp) + electron-updater e TODA a sua arvore. O electron-builder NAO
  # incluia builder-util-runtime/fs-extra/semver sozinho (sao deps compartilhadas com o proprio
  # electron-builder devDep, ele cortava como "dev") -> require('electron-updater') estourava no
  # boot e o app TRAVAVA sem abrir o jogo. Listar explicitamente forca a inclusao. (v0.8.0 quebrou.)
  - node_modules/ws/**/*
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/js-yaml/**/*
  - node_modules/argparse/**/*
  - node_modules/semver/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/sax/**/*
win:
  target: nsis
  icon: renderer/logo-vp.ico            # icone do app/exe + dos atalhos (logo Vperts, 256x256)
  signAndEditExecutable: false
nsis:
  oneClick: true                        # duplo-clique instala e ja abre, sem telas
  perMachine: false                     # instala pro usuario (sem prompt de admin)
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true           # atalho na Area de Trabalho, com o icone
  createStartMenuShortcut: true         # e no Menu Iniciar
  shortcutName: Vperts Multi (Leve)     # nome IGUAL ao atalho do dono (ver /print 24/07)
  artifactName: VpertsMultiLeve-Setup-${version}.exe
# publish = canal do AUTO-UPDATE. Gera o latest.yml e embute o app-update.yml (owner/repo) que o
# electron-updater le pra achar versao nova. Release NORMAL (nao prerelease) pra o /releases/latest
# do GitHub retornar ela — e' de la que o updater default le o latest.yml.
publish:
  provider: github
  owner: ekooll
  repo: poke-multi-labs
  releaseType: release
